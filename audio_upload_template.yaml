AWSTemplateFormatVersion: '2010-09-09'
Description: >
  audio-upload

  Upload audio to AWS from local storage.

Parameters:
  ContainerAccountId:
    Type: String
    Description: Account ID under which container repository is located.
    Default: '817658541382'
  ApplicationEnvironment:
    Type: String
    Description: Environment in which application should be deployed.
    AllowedValues:
      - dev
      - prod
  ApplicationName:
    Type: String
    Description: Name of the application to be deployed.
    Default: audio_upload
  Workload:
    Type: String
    Description: Name of workload for this stack.
    Default: audio_upload

Mappings:
  Directories:
    LocalStorageMountDir:
      dev: /assets
      prod: /assets
    LocalStorageSourcePath:
      dev: /mnt/dev
      prod: /mnt/prod

Resources:
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: Environment
          Value: !Ref ApplicationEnvironment
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Workload
          Value: !Ref Workload
        - Key: WorkloadType
          Value: processing
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Policies:
        - PolicyName: LogPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: 
                  - !GetAtt InternalValidationLogGroup.Arn
        - PolicyName: EcrPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 
                  - 'ecr:BatchCheckLayerAvailability'
                  - 'ecr:GetDownloadUrlForLayer'
                  - 'ecr:BatchGetImage'
                Resource: 
                  - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${ContainerAccountId}:repository/${ApplicationName}
              - Effect: Allow
                Action:
                  - 'ecr:GetAuthorizationToken'
                Resource: "*"
        - PolicyName: SSMPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'ssm:GetParameters'
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ApplicationEnvironment}/${ApplicationName}/*

  AudioUploadUser:
    Type: AWS::IAM::User
    Properties:
      Tags:
        - Key: Environment
          Value: !Ref ApplicationEnvironment
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Workload
          Value: !Ref Workload
        - Key: WorkloadType
          Value: processing

  AudioUploadUserAccessKey:
    Type: AWS::IAM::AccessKey
    Properties: 
      UserName: !Ref AudioUploadUser

  AudioUploadUserIdParameter:
    Type: AWS::SSM::Parameter
    Properties: 
      Description: Secret Access Key ID for AudioUploadUser.
      Name: !Sub /${ApplicationEnvironment}/${ApplicationName}/AWS_ACCESS_KEY_ID
      Tags: 
        Environment: !Ref ApplicationEnvironment
        Application: !Ref ApplicationName
        Workload: !Ref Workload
        WorkloadType: processing
      Type: String
      Value: !Ref AudioUploadUserAccessKey

  AudioUploadUserKeyParameter:
    Type: AWS::SSM::Parameter
    Properties: 
      Description: Secret Access Key for AudioUploadUser.
      Name: !Sub /${ApplicationEnvironment}/${ApplicationName}/AWS_SECRET_ACCESS_KEY
      Tags: 
        Environment: !Ref ApplicationEnvironment
        Application: !Ref ApplicationName
        Workload: !Ref Workload
        WorkloadType: processing
      Type: String
      Value: !GetAtt AudioUploadUserAccessKey.SecretAccessKey

  AudioUploadS3Role:
    Type: AWS::IAM::Role
    Properties: 
      Tags:
        - Key: Environment
          Value: !Ref ApplicationEnvironment
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Workload
          Value: !Ref Workload
        - Key: WorkloadType
          Value: processing
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: 
              AWS:
                - !GetAtt AudioUploadUser.Arn
            Action:
              - 'sts:AssumeRole'
      Description: 'Allows management of S3 assets.'
      Policies:
        - PolicyName: AudioUploadS3ObjectPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 
                  - 's3:GetObject'
                  - 's3:PutObject'
                Resource: 
                  - !Sub arn:${AWS::Partition}:s3:::rac-${ApplicationEnvironment}-av-upload-audio/*

  AudioUploadLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: 
      LogGroupName: !Sub "/audio_upload/ecs/${ApplicationName}"
      RetentionInDays: 90
      Tags:
        - Key: Environment
          Value: !Ref ApplicationEnvironment
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Workload
          Value: !Ref Workload
        - Key: WorkloadType
          Value: processing

  AudioUploadECSTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Memory: "24576"
      ContainerDefinitions: 
        - Name: !Ref ApplicationName
          Image: !Sub "${ContainerAccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ApplicationName}:${ApplicationEnvironment}"
          Essential: true
          Environment:
            - Name: AWS_ROLE_ARN
              Value: !GetAtt AudioUploadS3Role.Arn
            - Name: ENV
              Value: !Ref ApplicationEnvironment
            - Name: AWS_BUCKET_NAME
              Value: !Sub rac-${ApplicationEnvironment}-image-upload
            - Name: AWS_REGION_NAME
              Value: !Ref AWS::Region
            - Name: ROOT_DIR
              Value: !FindInMap [Directories, LocalStorageMountDir, !Ref ApplicationEnvironment]
          MountPoints:
            - SourceVolume: local_storage
              ContainerPath: !FindInMap [Directories, LocalStorageMountDir, !Ref ApplicationEnvironment]
              ReadOnly: false
          ReadonlyRootFilesystem: true
          Secrets:
            - Name: AWS_ACCESS_KEY_ID
              ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AudioUploadUserIdParameter}'
            - Name: AWS_SECRET_ACCESS_KEY
              ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AudioUploadUserKeyParameter}'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              "awslogs-group": !Ref AudioUploadLogGroup
              "awslogs-region": "us-east-1"
              "awslogs-stream-prefix": "on-prem"
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      Family: !Ref ApplicationName
      NetworkMode: bridge
      RequiresCompatibilities:
        - EXTERNAL
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      Tags:
        - Key: Environment
          Value: !Ref ApplicationEnvironment
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Workload
          Value: !Ref Workload
        - Key: WorkloadType
          Value: processing
      Volumes: 
        - Name: local_storage
          Host: 
            SourcePath: !FindInMap [Directories, LocalStorageSourcePath, !Ref ApplicationEnvironment]

Outputs:
  ValidationECSTask:
    Description: "Validation ECS Task Definition ARN"
    Value: !Ref AudioUploadECSTask